<title>ITAC Control Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: ops cockpit. Phase strip on top, three columns below (agents | review queue | runs+plan+bugs); tabs on phone. */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --sunk:#e9edef; --line:#d5dce0; --fg:#15202a; --muted:#5b6973;
  --accent:#0f5f8c; --accent-soft:#dcebf4;
  --ok:#17804a; --ok-soft:#dff2e7; --warn:#a45f00; --warn-soft:#fbeed6; --bad:#b4232c; --bad-soft:#fae1e2;
  --idle:#6f7d87; --idle-soft:#e8ecef; --review:#6a3fb5; --review-soft:#ece4f9;
  --add:#e2f4e8; --del:#fbe5e6;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --panel:#161e24; --sunk:#1d272e; --line:#2b3841; --fg:#e3eaee; --muted:#93a3ad;
  --accent:#5fb3e4; --accent-soft:#16344a;
  --ok:#4fc283; --ok-soft:#14321f; --warn:#e3a443; --warn-soft:#3a2a10; --bad:#f0737a; --bad-soft:#3d1a1d;
  --idle:#93a3ad; --idle-soft:#222d34; --review:#b394ef; --review-soft:#2b2240;
  --add:#16301f; --del:#3a1b1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --panel:#161e24; --sunk:#1d272e; --line:#2b3841; --fg:#e3eaee; --muted:#93a3ad;
  --accent:#5fb3e4; --accent-soft:#16344a;
  --ok:#4fc283; --ok-soft:#14321f; --warn:#e3a443; --warn-soft:#3a2a10; --bad:#f0737a; --bad-soft:#3d1a1d;
  --idle:#93a3ad; --idle-soft:#222d34; --review:#b394ef; --review-soft:#2b2240;
  --add:#16301f; --del:#3a1b1e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{font:700 16px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 11px var(--f-mono);color:var(--muted);text-transform:none;letter-spacing:0}
.clocks{display:flex;gap:18px;align-items:center;margin-left:auto;flex-wrap:wrap}
.clock{display:flex;flex-direction:column;gap:1px}
.clock b{font:600 18px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.clock span{font:600 10px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.clock.hot b{color:var(--warn)}
.clock.crit b{color:var(--bad)}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.themebtn{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:4px 8px;font-size:12px}

/* Phase strip */
.strip{position:relative;height:30px;margin-block:0 10px;display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sunk)}
.ph{position:relative;flex:var(--w) 1 0;min-width:0;border-right:1px solid var(--line);padding:3px 6px;font:600 10px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ph:last-child{border-right:0}
.ph em{display:block;font:400 10px var(--f-mono);font-style:normal;text-transform:none;letter-spacing:0}
.ph.past{background:var(--idle-soft)}
.ph.now{background:var(--accent-soft);color:var(--accent)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2}
.gatemark{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--review);z-index:1}

/* Tabs (phone) */
.tabs{display:none;gap:4px;overflow-x:auto;padding-block:0 8px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:6px 10px;white-space:nowrap;font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--panel);border-color:var(--accent)}

/* Grid */
main.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);gap:12px;padding-block:12px 24px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.ph-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ph-h h2{margin:0;font:700 12px var(--f-display);text-transform:uppercase;letter-spacing:.08em}
.ph-h .count{font:500 11px var(--f-mono);color:var(--muted)}
.ph-h .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.body{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font:600 10.5px/18px var(--f-display);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-working{background:var(--accent-soft);color:var(--accent)}
.s-blocked{background:var(--bad-soft);color:var(--bad)}
.s-review{background:var(--review-soft);color:var(--review)}
.s-done{background:var(--ok-soft);color:var(--ok)}
.s-paused{background:var(--idle-soft);color:var(--idle)}
.s-warn{background:var(--warn-soft);color:var(--warn)}
.tag{font:600 10.5px var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--muted);white-space:nowrap}
.tag.p1{color:var(--bad);border-color:currentColor}
.tag.p2{color:var(--warn);border-color:currentColor}
.tag.p3{color:var(--idle);border-color:currentColor}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 9px;font:500 12px var(--f-body);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:1px 7px;font-size:11.5px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Agents */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.agent{border:1px solid var(--line);border-radius:5px;padding:7px 9px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--panel)}
.agent[data-state="blocked"]{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.agent[data-state="review"]{box-shadow:inset 3px 0 0 var(--review)}
.agent .ah{display:flex;align-items:center;gap:6px;justify-content:space-between}
.agent .an{font:600 13px var(--f-display);letter-spacing:.02em}
.agent .task{color:var(--fg);font-size:12.5px;overflow-wrap:anywhere}
.agent .meta{font:400 11px var(--f-mono);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.agent .meta .row{margin-left:auto}
.agent .note{font-size:11.5px;color:var(--bad)}

/* Review queue */
.pr{border:1px solid var(--line);border-radius:5px;overflow:hidden}
.pr-h{padding:8px 10px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.pr-h .t{flex:1 1 240px;min-width:0}
.pr-h .t b{font-weight:600}
.pr-h .t .sub{font:400 11px var(--f-mono);color:var(--muted);margin-top:2px}
.ord{font:600 11px var(--f-mono);background:var(--sunk);border-radius:3px;padding:1px 5px;color:var(--muted)}
.pr-b{border-top:1px solid var(--line);padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px}
.kv h4{margin:0 0 2px;font:600 10px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kv p,.kv ul{margin:0;font-size:12.5px}
.kv ul{padding-left:16px}
.full{grid-column:1/-1}
.files{font:400 11.5px var(--f-mono);display:flex;flex-direction:column;gap:1px;min-width:0}
.files span{overflow-wrap:anywhere}
.files .out{color:var(--bad)}
.banner{border-radius:4px;padding:5px 8px;font-size:12px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
details.diff summary{cursor:pointer;font:600 11px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.diffbox{margin-top:4px;overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--sunk)}
.diffbox pre{margin:0;padding:6px 0;font:400 11.5px/1.5 var(--f-mono)}
.diffbox .l{display:block;padding:0 8px;white-space:pre}
.diffbox .a{background:var(--add)}
.diffbox .d{background:var(--del)}
.diffbox .h{color:var(--muted)}
.pr-f{border-top:1px solid var(--line);padding:7px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--sunk)}
.pr-f .grow{flex:1}
.tenten{font:600 12px var(--f-mono)}
.tenten.ok{color:var(--ok)}
.comment{display:flex;gap:6px;width:100%}
.comment textarea{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg);font:12.5px var(--f-body);padding:5px}

/* Runs */
table.runs{width:100%;border-collapse:collapse;font-size:12px}
.tbl{overflow-x:auto}
table.runs th{font:600 10px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:3px 6px;border-bottom:1px solid var(--line)}
table.runs td{padding:5px 6px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.runs td.r,table.runs th.r{text-align:right}
.res{font-weight:600}
.res.ok{color:var(--ok)} .res.bad{color:var(--bad)} .res.run{color:var(--accent)}
.gate{border:1px solid var(--line);border-radius:5px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.gate .gh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.gate .gh b{font:700 13px var(--f-display);letter-spacing:.03em}
.jobs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.job{border-radius:4px;padding:4px 0;text-align:center;font:600 11px var(--f-mono)}
.job.ok{background:var(--ok-soft);color:var(--ok)}
.job.bad{background:var(--bad-soft);color:var(--bad)}
.job.run{background:var(--accent-soft);color:var(--accent)}
.verdicts{display:flex;gap:6px;flex-wrap:wrap;font:500 11.5px var(--f-mono)}
.verdicts span{background:var(--sunk);border-radius:3px;padding:1px 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:3px 8px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* Plan */
ol.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.plan li{display:grid;grid-template-columns:18px 26px minmax(0,1fr) auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px}
ol.plan li:last-child{border-bottom:0}
ol.plan .rk{font:500 11px var(--f-mono);color:var(--muted);text-align:right}
ol.plan .nm{min-width:0;overflow-wrap:anywhere}
ol.plan .nm small{display:block;font:400 11px var(--f-mono);color:var(--muted)}
ol.plan li.closed .nm{color:var(--muted)}
ol.plan input{margin:0;accent-color:var(--ok)}

/* Bugs */
.bug{border:1px solid var(--line);border-radius:5px;padding:7px 9px;display:flex;flex-direction:column;gap:4px}
.bug .bt{font-weight:600}
.bug .bm{font:400 11px var(--f-mono);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.sev{font:600 10.5px var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.sev.high{color:var(--bad)} .sev.medium{color:var(--warn)} .sev.low{color:var(--idle)}
.sub-h{font:600 10px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:2px}
.sample{font:500 10.5px var(--f-mono);color:var(--warn);background:var(--warn-soft);border-radius:3px;padding:1px 6px}

/* Toast + dialog */
.toasts{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:6px;z-index:20;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);border-radius:5px;padding:8px 12px;font:12px var(--f-mono);box-shadow:0 4px 14px rgba(0,0,0,.18);overflow-wrap:anywhere}
.toast b{font-family:var(--f-body)}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:6px;width:min(440px,100%);padding:14px;display:flex;flex-direction:column;gap:10px}
.dialog h3{margin:0;font:700 14px var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.dialog textarea{min-height:90px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg);font:13px var(--f-body);padding:6px}
.dialog .hint{font:400 11px var(--f-mono);color:var(--muted)}

@media (max-width:1180px){
  main.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
  .col.c3{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
}
@media (max-width:760px){
  .tabs{display:flex}
  main.grid{display:block;padding-top:4px}
  .col{display:contents}
  section.panel{display:none;margin-bottom:12px}
  section.panel.active{display:block}
  .pr-b{grid-template-columns:minmax(0,1fr)}
  .ph em{display:none}
  .clocks{margin-left:0;width:100%;justify-content:space-between}
  .agents{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="topin">
      <div class="brand">ITAC Control Center <small>finals · Wed 4.11 · <span class="sample">mockup · sample data</span></small></div>
      <div class="clocks">
        <div class="clock" id="clk-now"><b>19:32</b><span>Now</span></div>
        <div class="clock" id="clk-next"><b>—</b><span>Next gate</span></div>
        <div class="clock" id="clk-sub"><b>—</b><span>To submit 20:55</span></div>
        <label class="toggle"><input type="checkbox" id="realclock"> real clock</label>
        <button class="themebtn" id="themebtn" type="button">Theme</button>
      </div>
    </div>
    <div class="strip" id="strip" aria-label="Competition timeline"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main class="grid wrap">
  <div class="col c1">
    <section class="panel" id="p-agents" data-tab="Agents">
      <div class="ph-h"><h2>Agents</h2><span class="count" id="agent-count"></span><div class="sp"><button class="btn sm" data-act="pauseall">Pause all</button></div></div>
      <div class="body"><div class="agents" id="agents"></div></div>
    </section>
  </div>
  <div class="col c2">
    <section class="panel active" id="p-review" data-tab="Review">
      <div class="ph-h"><h2>Review queue</h2><span class="count" id="pr-count"></span><div class="sp"><span class="count">P1→P3, then merge order</span></div></div>
      <div class="body" id="prs"></div>
    </section>
  </div>
  <div class="col c3">
    <section class="panel" id="p-ci" data-tab="CI & gate">
      <div class="ph-h"><h2>CI and gate</h2><div class="sp">
        <span class="seg" role="group" aria-label="Gate mode"><button type="button" aria-pressed="true" data-mode="parallel">parallel</button><button type="button" aria-pressed="false" data-mode="sequential">sequential</button></span>
        <button class="btn sm primary" data-act="gate">Start gate</button></div></div>
      <div class="body" id="ci"></div>
    </section>
    <section class="panel" id="p-plan" data-tab="Test plan">
      <div class="ph-h"><h2>Test plan</h2><span class="count" id="plan-count"></span><div class="sp"><button class="btn sm" data-act="openplan">Open pinned issue</button></div></div>
      <div class="body"><ol class="plan" id="plan"></ol></div>
    </section>
    <section class="panel" id="p-bugs" data-tab="Bugs">
      <div class="ph-h"><h2>Bugs</h2><span class="count" id="bug-count"></span></div>
      <div class="body" id="bugs"></div>
    </section>
  </div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="scrim" id="scrim" hidden>
  <form class="dialog" id="notedlg">
    <h3 id="note-title">Note to agent</h3>
    <label for="note-text" class="hint" id="note-hint">Written to .agents/inbox/&lt;agent&gt;.md — the agent reads it before its next step.</label>
    <textarea id="note-text" placeholder="e.g. Skip the wishlist flow, it needs a second account."></textarea>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="note-cancel">Cancel</button><button type="submit" class="btn primary">Send note</button></div>
  </form>
</div>

<script>
(() => {
  const REPO = 'kaylamenashe8/itac-finals-2026';
  const GH = `https://github.com/${REPO}`;
  const PAGES = 'https://kaylamenashe8.github.io/itac-finals-2026';
  const MERGE_ORDER = ['architect','stabilizer','ci-infra','coverage','visual-bonus','triage'];

  // ---- sample data (mockup) ----

    {id:'recon',name:'Recon',state:'done',task:'BASELINE.md committed, tag baseline, first CI run linked',plan:'—',upd:'18:19'},

    {id:'stabilizer-3',name:'Stabilizer 3',state:'blocked',task:'cart.total.spec.ts fails 10/10 on 2xx responses',plan:'#6',upd:'19:12',note:'Needs Lead: product or test data? Crawler diagnose says product.'},

    {id:'coverage-2',name:'Coverage 2',state:'review',task:'Auth: logout clears session, back button stays logged out',plan:'#8',upd:'19:26',pr:44},

  ];

  const prs = [

    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === s)));
  }));
  document.getElementById('realclock').addEventListener('change', (e) => { useReal = e.target.checked; renderClock(); });
  document.getElementById('themebtn').addEventListener('click', () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark';
  });

  // ---- phone tabs ----
  const panels = [...document.querySelectorAll('section.panel')];
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = panels.map(p => `<button role="tab" type="button" data-target="${p.id}" aria-selected="${p.classList.contains('active')}">${p.dataset.tab}</button>`).join('');
  tabs.addEventListener('click', (e) => {
    const t = e.target.closest('[data-target]'); if (!t) return;
    panels.forEach(p => p.classList.toggle('active', p.id === t.dataset.target));
    tabs.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x === t)));
  });

  renderClock(); renderAgents(); renderPRs(); renderCI(); renderPlan(); renderBugs();
  setInterval(() => { if (useReal) renderClock(); }, 15000);
})();
</script>
